<!DOCTYPE html>
<html lang="en">
<head>

<title>Suha Care — Hospital, Doctor &amp; Lab Booking Prototype</title>

<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F7F4EE;
    --ink:#1C2B2A;
    --ink-soft:#5B6664;
    --teal:#114B4F;
    --teal-deep:#0B3437;
    --sage:#6B9080;
    --sage-light:#E4EBE6;
    --marigold:#E8A33D;
    --marigold-deep:#C6801F;
    --alert:#C1443B;
    --alert-light:#F7E4E1;
    --line:#DCD5C6;
    --card:#FFFFFF;
    --radius:16px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    font-family:'Inter',sans-serif;
    color:var(--ink);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:18px 10px 40px;
  }
  h1,h2,h3{font-family:'Fraunces',serif; margin:0;}
  .mono{font-family:'IBM Plex Mono',monospace;}

  /* --- control bar --- */
  .control-bar{
    width:100%;
    max-width:400px;
    margin-bottom:14px;
  }
  .brand-row{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:10px;
    gap:8px;
  }
  .brand{
    font-family:'Fraunces',serif;
    font-weight:700;
    font-size:20px;
    color:var(--teal-deep);
    letter-spacing:-0.02em;
  }
  .brand span{color:var(--marigold-deep);}
  .brand-tag{
    font-size:10.5px;
    color:var(--ink-soft);
    font-family:'IBM Plex Mono',monospace;
    letter-spacing:0.02em;
  }
  .control-actions{display:flex; gap:6px; flex-shrink:0;}
  .persona-toggle{
    display:flex;
    background:var(--sage-light);
    border-radius:999px;
    padding:4px;
    gap:4px;
  }
  .persona-toggle button{
    flex:1;
    border:none;
    background:transparent;
    padding:10px 4px;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:11.5px;
    color:var(--ink-soft);
    border-radius:999px;
    cursor:pointer;
    transition:all .2s ease;
    white-space:nowrap;
  }
  .persona-toggle button.active{
    background:var(--teal);
    color:#fff;
    box-shadow:0 3px 10px rgba(17,75,79,0.28);
  }

  /* --- phone frame --- */
  .phone{
    width:100%;
    max-width:400px;
    background:#0e1614;
    border-radius:38px;
    padding:12px;
    box-shadow:0 30px 60px -25px rgba(17,52,55,0.5), 0 8px 20px -8px rgba(17,52,55,0.35);
  }
  .phone-screen{
    background:var(--paper);
    border-radius:28px;
    overflow:hidden;
    height:760px;
    max-height:78vh;
    display:flex;
    flex-direction:column;
    position:relative;
  }
  .notch{
    position:absolute;
    top:0; left:50%;
    transform:translateX(-50%);
    width:120px; height:22px;
    background:#0e1614;
    border-radius:0 0 14px 14px;
    z-index:50;
  }
  .status-bar{
    padding:16px 22px 6px;
    display:flex;
    justify-content:space-between;
    font-size:12px;
    font-family:'IBM Plex Mono',monospace;
    color:var(--ink-soft);
    flex-shrink:0;
  }

  .screen-body{
    flex:1;
    overflow-y:auto;
    padding:6px 18px 90px;
  }
  .screen-body::-webkit-scrollbar{width:0;}

  .topbar{
    display:flex;
    align-items:center;
    gap:10px;
    padding:6px 2px 14px;
  }
  .back-btn{
    width:32px;height:32px;
    border-radius:10px;
    background:var(--sage-light);
    border:none;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    color:var(--teal-deep);
    font-size:16px;
    flex-shrink:0;
  }
  .topbar h2{font-size:18px; color:var(--teal-deep); line-height:1.2;}
  .topbar .sub{font-size:11.5px; color:var(--ink-soft); margin-top:1px;}

  .card{
    background:var(--card);
    border-radius:var(--radius);
    padding:14px;
    margin-bottom:12px;
    border:1px solid var(--line);
  }
  .card:active{transform:scale(0.99);}

  .btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    width:100%;
    border:none;
    border-radius:12px;
    padding:14px 16px;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:14.5px;
    cursor:pointer;
    transition:transform .15s ease, opacity .15s ease;
  }
  .btn:active{transform:scale(0.97);}
  .btn-primary{background:var(--teal); color:#fff;}
  .btn-marigold{background:var(--marigold); color:var(--teal-deep);}
  .btn-outline{background:transparent; color:var(--teal); border:1.5px solid var(--teal);}
  .btn-alert{background:var(--alert); color:#fff;}
  .btn-ghost{background:var(--sage-light); color:var(--teal-deep);}
  .btn-sm{padding:9px 12px; font-size:12.5px; width:auto;}
  .btn-row{display:flex; gap:8px;}
  .btn-row .btn{flex:1;}

  .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--marigold-deep);
    margin-bottom:4px;
    display:block;
  }

  .search-input{
    width:100%;
    padding:13px 14px;
    border-radius:12px;
    border:1.5px solid var(--line);
    background:#fff;
    font-family:'Inter',sans-serif;
    font-size:14px;
    color:var(--ink);
    margin-bottom:12px;
  }
  .search-input:focus{outline:2px solid var(--teal); border-color:var(--teal);}
  select.search-input{ -webkit-appearance:none; appearance:none; }

  .tag{
    display:inline-block;
    font-size:11px;
    font-weight:600;
    padding:3px 9px;
    border-radius:999px;
    background:var(--sage-light);
    color:var(--teal-deep);
  }
  .tag-marigold{background:#FBEBD0; color:var(--marigold-deep);}
  .tag-alert{background:var(--alert-light); color:var(--alert);}

  .row{display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .avatar{
    width:44px;height:44px;border-radius:12px;
    background:linear-gradient(135deg,var(--sage),var(--teal));
    display:flex;align-items:center;justify-content:center;
    color:#fff; font-family:'Fraunces',serif; font-weight:600; font-size:16px;
    flex-shrink:0;
  }

  .slot-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:10px 0;}
  .slot{
    padding:10px 4px;
    text-align:center;
    border-radius:10px;
    border:1.5px solid var(--line);
    background:#fff;
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    cursor:pointer;
    color:var(--ink);
  }
  .slot.selected{background:var(--teal); color:#fff; border-color:var(--teal);}
  .slot.taken{opacity:0.35; text-decoration:line-through; cursor:not-allowed;}

  .divider{height:1px; background:var(--line); margin:14px 0;}

  .bottom-nav{
    position:absolute;
    bottom:0; left:0; right:0;
    background:#fff;
    border-top:1px solid var(--line);
    display:flex;
    padding:8px 4px calc(8px + env(safe-area-inset-bottom,0px));
    z-index:40;
  }
  .nav-item{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:3px;
    background:none;
    border:none;
    cursor:pointer;
    padding:6px 1px;
    color:var(--ink-soft);
    font-size:9.5px;
    font-weight:600;
    font-family:'Inter',sans-serif;
  }
  .nav-item.active{color:var(--teal);}
  .nav-dot{width:20px;height:20px;display:flex;align-items:center;justify-content:center;font-size:15px;}

  .empty-state{
    text-align:center;
    padding:50px 14px;
    color:var(--ink-soft);
  }
  .empty-state h3{color:var(--teal-deep); font-size:16px; margin-bottom:6px;}
  .empty-state p{font-size:12.5px; line-height:1.5;}

  .toast{
    position:absolute;
    bottom:96px; left:18px; right:18px;
    background:var(--teal-deep);
    color:#fff;
    padding:12px 14px;
    border-radius:12px;
    font-size:12.5px;
    display:flex;
    align-items:center;
    gap:8px;
    box-shadow:0 10px 24px -8px rgba(0,0,0,0.4);
    z-index:60;
    animation:slideUp .25s ease;
  }
  @keyframes slideUp{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);}}

  .hero-card{
    background:linear-gradient(135deg, var(--teal) 0%, var(--teal-deep) 100%);
    border-radius:20px;
    padding:20px;
    color:#fff;
    margin-bottom:16px;
    position:relative;
    overflow:hidden;
  }
  .hero-card::after{
    content:'';
    position:absolute;
    right:-30px; top:-30px;
    width:120px;height:120px;
    border-radius:50%;
    background:rgba(232,163,61,0.18);
  }
  .hero-card h3{color:#fff; font-size:19px; margin-bottom:6px; position:relative;}
  .hero-card p{font-size:12.5px; color:rgba(255,255,255,0.75); margin:0 0 14px; position:relative;}

  .quick-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px;}
  .quick-tile{
    background:#fff;
    border:1px solid var(--line);
    border-radius:14px;
    padding:14px 12px;
    cursor:pointer;
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .quick-tile .icon{font-size:20px;}
  .quick-tile .label{font-size:12.5px; font-weight:600; color:var(--teal-deep);}

    width:100%;
    padding:11px 12px;
    border-radius:10px;
    border:1.5px solid var(--line);
    font-family:'Inter',sans-serif;
    font-size:13px;
    margin-bottom:8px;
  }

  .stepper{display:flex; align-items:center; gap:6px; margin-bottom:16px;}
  .step-dot{
    height:4px; flex:1; border-radius:4px; background:var(--line);
  }
  .step-dot.done{background:var(--teal);}

  .fine{font-size:11.5px; color:var(--ink-soft); line-height:1.5;}
  .access-log{font-size:10.5px; color:var(--ink-soft); margin-top:6px; line-height:1.6;}

  ::selection{background:var(--marigold); color:var(--teal-deep);}
</style>
</head>

<script>

/* Rough demo price lookup for doctor-prescribed medicines */
function priceForMed(medText){
  const base = medText.split('–')[0].trim().toLowerCase();
  const table = {paracetamol:20, amoxicillin:65, vitamin:90, ors:25, azithromycin:110, cetirizine:30, pantoprazole:55, calcium:75};
  for(const k in table){ if(base.includes(k)) return table[k]; }
  let sum=0; for(let i=0;i<base.length;i++) sum += base.charCodeAt(i);
  return 30 + (sum % 90);
}

/* The demo "patient app" account is also searchable from the Lab & Doctor apps,
   sharing the exact same arrays as the patient's own screens —

function go(screen, extra){
  state.history.push(state.screen);
  Object.assign(state, extra||{});
  state.screen = screen;
  render();
}
function back(){
  state.screen = state.history.pop() || 'landing';
  render();
}
function goLanding(){
  state.history = [];
  state.screen = 'landing';
  render();
}
function setPersona(p){
  state.persona = p;
  state.history = [];
  if(p==='patient') state.screen = 'home';
  else if(p==='doctor') state.screen = state.doctorHospital ? 'doctorDashboard' : 'doctorLogin';
  else state.screen = state.labId ? 'labDashboard' : 'labLogin';
  render();
}
function toast(msg){
  const host = document.getElementById('toastHost');
  const el = document.createElement('div');
  el.className='toast';
  el.innerHTML = `<span>✅</span><span>${msg}</span>`;
  host.innerHTML='';
  host.appendChild(el);
  setTimeout(()=>{ if(host.contains(el)) host.removeChild(el); }, 2800);
}
function hospitalById(id){ return hospitals.find(h=>h.id===id); }
function doctorById(id){ return doctors.find(d=>d.id===id); }
function doctorsFor(hospitalId){ return doctors.filter(d=>d.hospital===hospitalId); }
function nowStamp(){
  const d = new Date();
  let h = d.getHours()%12 || 12;
  const m = d.getMinutes().toString().padStart(2,'0');
  const ap = d.getHours()>=12 ? 'PM' : 'AM';
  return `23 Aug 2026, ${h}:${m} ${ap}`;
}

function render(){
  const body = document.getElementById('screenBody');
  const nav = document.getElementById('bottomNav');
  if(state.screen==='appHome'){
    body.innerHTML = appHomeScreen();
    nav.innerHTML = '';
    body.scrollTop = 0;
    return;
  }
  if(state.screen==='landing'){
    body.innerHTML = landingScreen();
    nav.innerHTML = '';
    body.scrollTop = 0;
    return;
  }
  body.innerHTML = state.persona==='patient' ? renderPatient() : (state.persona==='doctor' ? renderDoctor() : renderLab());
  nav.innerHTML = state.persona==='patient' ? patientNav() : (state.persona==='doctor' ? doctorNav() : labNav());
  body.scrollTop = 0;
}

   A real Claude-powered chat, scoped to: (1) helping the patient use this

function escapeHtml(s){

function aiAssistantScreen(){
  return `

    ${renderAiChatLog()}
  </div>
  <div class="card">

      <button class="btn btn-outline btn-sm" id="aiMicBtn" onclick="toggleAiMic()">🎤 Speak</button>
      <button class="btn btn-outline btn-sm" onclick="toggleAiVoiceLang()">${state.aiVoiceLang==='ta-IN' ? '🇮🇳 தமிழ்' : '🇬🇧 English'}</button>

function renderAiChatLog(){
  if(!state.aiChat.length){
    return `<div class="empty-state"><h3>No messages yet</h3><p>Try: "How do I book a doctor appointment?" or "என் மாத்திரை எதுக்கு?"</p></div>`;
  }
  return state.aiChat.map(m=>`
    <div style="align-self:${m.role==='user'?'flex-end':'flex-start'}; max-width:88%;">

function buildAiContext(){
  const meds = state.myPrescriptions.flatMap(p=>p.meds);
  return `You are the in-app AI assistant for "Suha Health Care" — a hospital search, doctor appointment booking, e-prescription and pharmacy app for Sivakasi and nearby towns in Tamil Nadu, India.

Your job, in order of priority:
1. Help the patient use THIS app. If they ask how to book an appointment, walk them through the app's actual steps: Home → "Search Hospitals" → pick a hospital → open a doctor's profile → pick an available time slot → optionally write a reason for the visit (it's optional) → pay the consultation fee → they get a token number and can see it under "My Appointments". Also explain, when relevant: ordering prescribed/OTC medicines from a hospital's Pharmacy tab and paying online, booking a lab test / home sample collection, viewing prescriptions under "My Prescriptions", and posting anonymous questions under "Ask a Doctor".
2. If asked what a prescribed tablet/medicine is for, explain in simple, general, educational terms only (what that class of medicine is commonly used for) — this is NOT personal medical advice or a diagnosis. Always gently remind them to follow their doctor's/pharmacist's instructions for anything specific to their own dose or condition.
3. Answer other general health doubts helpfully and safely, in simple language, with the same reminder that this isn't a substitute for seeing a doctor for anything serious or urgent.

CRITICAL LANGUAGE RULE: Always reply in the same language and script the patient used in their latest message — Tamil script, Tanglish (Tamil in English letters), English, Hindi, or whatever they wrote in. Match their language exactly, don't switch to English by default.

Keep replies short and conversational — 3-5 sentences max, since this is a small mobile chat screen.
${meds.length ? `For reference, this patient's medicines currently on file in the app are: ${meds.join(', ')}.` : ''}`;
}
async function sendAiMessage(){
  if(state.aiChat.some(m=>m.pending)) return;
  const box = document.getElementById('aiInput');
  if(!box) return;
  const text = box.value.trim();
  if(!text) return;
  box.value = '';
  state.aiChat.push({role:'user', content:text});
  state.aiChat.push({role:'assistant', content:'', pending:true});
  render();
  scrollAiToBottom();

  try {
    const history = state.aiChat.filter(m=>!m.pending).map(m=>({role:m.role, content:m.content}));
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 1000,
        system: buildAiContext(),
        messages: history
      })
    });
    const data = await response.json();
    const reply = ((data && data.content) || []).map(c=>c.text||'').join('\n').trim()
      || "Sorry, I couldn't understand that — could you try again?";
    state.aiChat = state.aiChat.filter(m=>!m.pending);
    state.aiChat.push({role:'assistant', content:reply});
    speakAiReply(reply);
  } catch(e){
    state.aiChat = state.aiChat.filter(m=>!m.pending);
    state.aiChat.push({role:'assistant', content:"Sorry, I'm having trouble connecting right now. Please try again in a moment."});
  }
  render();
  scrollAiToBottom();
}
function scrollAiToBottom(){
  setTimeout(()=>{
    const body = document.getElementById('screenBody');
    if(body) body.scrollTop = body.scrollHeight;
  }, 30);
}

/* ---- Voice input (speech-to-text) and voice output (text-to-speech) ---- */
let aiRecognition = null;
function toggleAiVoiceLang(){
  state.aiVoiceLang = state.aiVoiceLang==='ta-IN' ? 'en-IN' : 'ta-IN';
  render();
}
function toggleAiSpeakReplies(){
  state.aiSpeakReplies = !state.aiSpeakReplies;
  if(!state.aiSpeakReplies && window.speechSynthesis) window.speechSynthesis.cancel();
  render();
}
function toggleAiMic(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ toast('Voice input is not supported on this browser'); return; }
  if(aiRecognition){ aiRecognition.stop(); return; }
  aiRecognition = new SR();
  aiRecognition.lang = state.aiVoiceLang;
  aiRecognition.interimResults = false;
  aiRecognition.maxAlternatives = 1;
  aiRecognition.onstart = ()=>{
    const btn = document.getElementById('aiMicBtn');
    if(btn){ btn.textContent = '🎙️ Listening…'; btn.classList.add('btn-marigold'); btn.classList.remove('btn-outline'); }
  };
  aiRecognition.onresult = (e)=>{
    const transcript = e.results[0][0].transcript;
    const box = document.getElementById('aiInput');
    if(box) box.value = transcript;
    if(transcript && transcript.trim()) sendAiMessage();
  };
  aiRecognition.onerror = ()=>{ toast("Couldn't hear you clearly — try again"); };
  aiRecognition.onend = ()=>{
    aiRecognition = null;
    const btn = document.getElementById('aiMicBtn');
    if(btn){ btn.textContent = '🎤 Speak'; btn.classList.remove('btn-marigold'); btn.classList.add('btn-outline'); }
  };
  aiRecognition.start();
}
function speakAiReply(text){
  if(!state.aiSpeakReplies || !window.speechSynthesis || !text) return;
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  const isTamil = /[\u0B80-\u0BFF]/.test(text);
  utter.lang = isTamil ? 'ta-IN' : 'en-IN';
  window.speechSynthesis.speak(utter);
}

  </div>
  ${state.doctorAppointments.map((a,idx)=>`
    <div class="card">
      <div class="row">
        <div class="row" style="gap:12px;">
          <div class="avatar">${a.patient[0]}</div>
          <div>
            <div style="font-weight:600; font-size:14px;">${a.patient}</div>
            <div class="fine">${a.reason}</div>
          </div>
        </div>
        <div style="text-align:right;">
          <div class="mono" style="font-size:12.5px; font-weight:600;">${a.time}</div>
          <div class="tag tag-marigold" style="margin-top:4px;">Token #${idx+1}</div>
        </div>
      </div>
      <div class="divider"></div>
      <div class="row">
        <span class="tag">${a.status}</span>
        <button class="btn btn-ghost btn-sm" onclick="go('reschedule', {rescheduleIdx:${idx}, rescheduleNewTime:null})">⚠️ Emergency — Change Time</button>
      </div>
    </div>`).join('')}
  `;
}
function rescheduleScreen(){
  const a = state.doctorAppointments[state.rescheduleIdx];
  const d = state.currentDoctor;
  const allTimes = d.slots.map(s=>s.t);
  const takenTimes = state.doctorAppointments
    .filter((x,i)=> i!==state.rescheduleIdx)
    .map(x=>x.time);
  return `
  ${topbar('Change Appointment Time', 'Emergency reschedule', true)}
  <div class="card">
    <div class="row" style="gap:12px;">
      <div class="avatar">${a.patient[0]}</div>
      <div>
        <div style="font-weight:600; font-size:14px;">${a.patient}</div>
        <div class="fine">${a.reason}</div>
      </div>
    </div>
    <div class="divider"></div>
    <div class="row"><span class="fine">Current time</span><span class="mono" style="font-size:12.5px;">${a.time}</span></div>
  </div>
  <span class="eyebrow">Choose from your own appointment timings</span>
  <div class="slot-grid">
    ${allTimes.map(t=>{
      const isTaken = takenTimes.includes(t) && t!==a.time;
      const isSelected = state.rescheduleNewTime===t;
      return `<div class="slot ${isTaken?'taken':''} ${isSelected?'selected':''}"
        onclick="${isTaken? '' : `selectRescheduleTime('${t}')`}">${t}</div>`;
    }).join('')}
  </div>
  <div class="fine" style="margin-bottom:14px;">These are your own OP timings for today. Greyed-out ones already have another patient booked. The patient will be notified on their phone (SMS if offline) the moment you confirm.</div>
  <button class="btn btn-alert" ${state.rescheduleNewTime? '' : 'style="opacity:0.45; pointer-events:none;"'} onclick="confirmReschedule()">
    Confirm New Time${state.rescheduleNewTime? ' · '+state.rescheduleNewTime : ''}
  </button>
  `;
}
function selectRescheduleTime(t){
  state.rescheduleNewTime = t;
  render();
}
function confirmReschedule(){
  const a = state.doctorAppointments[state.rescheduleIdx];
  a.time = state.rescheduleNewTime;
  a.status = 'Rescheduled';
  toast(a.patient + '\u2019s appointment moved to ' + a.time + ' — patient notified (SMS fallback if offline)');
  state.rescheduleNewTime = null;
  back();
}

function myPatientsScreen(){
  return `
  ${topbar('My Patients','Search a patient to view their reports', true)}
  <input class="search-input" placeholder="Search patient name..." oninput="filterPatients(this.value)">
  <div id="patientResults">${patientCards(samplePatients)}</div>
  `;
}
function patientCards(list){
  return list.map(p=>`
    <div class="card" onclick="go('patientRecord', {selPatient:'${p.id}'})">
      <div class="row">
        <div class="row" style="gap:12px;">
          <div class="avatar">${p.name[0]}</div>
          <div>
            <div style="font-weight:600; font-size:14px;">${p.name}</div>
            <div class="fine">Age ${p.age} · Last visit ${p.lastVisit}</div>
          </div>
        </div>
        <span class="tag">${p.reports.length} reports</span>
      </div>
    </div>`).join('');
}
function filterPatients(q){
  q=q.toLowerCase();
  const list = samplePatients.filter(p=>p.name.toLowerCase().includes(q));
  document.getElementById('patientResults').innerHTML = list.length ? patientCards(list) :
    `<div class="empty-state"><h3>No patient found</h3></div>`;
}

function patientRecordScreen(){
  const p = samplePatients.find(x=>x.id===state.selPatient);
  const otherDoctors = doctors.filter(dd=>dd.id !== state.currentDoctor.id);
  return `
  ${topbar(p.name, 'Age ' + p.age + ' · ' + p.phone, true)}
  <span class="eyebrow">Lab reports</span>
  ${p.reports.length ? p.reports.map((r,idx)=>`
    <div class="card">
      <div class="row">
        <div>
          <div style="font-weight:600; font-size:13.5px;">${r.name}</div>
          <div class="fine">${r.lab} · ${r.date}</div>
        </div>
        <button class="btn btn-outline btn-sm" onclick="doctorViewReport('${p.id}', ${idx})">View</button>
      </div>
    </div>`).join('') : `<div class="fine">No reports shared yet.</div>`}

  <span class="eyebrow" style="margin-top:6px; display:block;">Prescribe medicine</span>
  <div class="card">
    <input class="med-input" id="medName" placeholder="Medicine name, e.g. Paracetamol 500mg">
    <input class="med-input" id="medDose" placeholder="Dosage, e.g. 2x/day, 5 days">
    <textarea id="medNotes" rows="2" placeholder="Notes for patient (optional)"></textarea>
    <button class="btn btn-marigold" onclick="prescribe('${p.id}')">Send Prescription to Patient</button>
  </div>

  ${p.prescriptions.length? `<span class="eyebrow">Past prescriptions</span>` + p.prescriptions.map(pr=>`
    <div class="card">
      <div class="fine" style="font-weight:600; color:var(--teal-deep);">${pr.date} · ${pr.doctor}</div>
      ${pr.meds.map(m=>`<div class="fine">• ${m}</div>`).join('')}
    </div>`).join('') : ''}

  <span class="eyebrow" style="margin-top:6px; display:block;">⚠️ Refer to a specialist</span>
  <div class="card">
    <select class="search-input" id="referDoctor">
      ${otherDoctors.map(dd=>`<option value="${dd.id}">${dd.name} — ${dd.spec} (${hospitalById(dd.hospital).name})</option>`).join('')}
    </select>
    <textarea id="referReason" rows="2" placeholder="Reason for referral, e.g. Needs cardiology review"></textarea>
    <button class="btn btn-outline" onclick="referPatient('${p.id}')">Send Referral</button>
  </div>
  <div class="fine">The referred specialist's details go straight into the patient's app — they can book without hunting for that hospital themselves.</div>
  `;
}
function doctorViewReport(pid, idx){
  const p = samplePatients.find(x=>x.id===pid);
  const r = p.reports[idx];
  if(!r.accessLog) r.accessLog = [];
  r.accessLog.unshift({by: state.currentDoctor.name, role:'Doctor', time: nowStamp()});
  toast('Opening ' + r.name + ' — access logged for ' + p.name);
  render();
}
function prescribe(pid){
  const name = document.getElementById('medName').value.trim();
  const dose = document.getElementById('medDose').value.trim();
  if(!name){ toast('Enter a medicine name first'); return; }
  const p = samplePatients.find(x=>x.id===pid);
  p.prescriptions.unshift({doctor: state.currentDoctor.name, date:'23 Aug 2026', meds:[`${name}${dose? ' – '+dose : ''}`]});
  toast('Prescription sent to ' + p.name + '\u2019s app');
  render();
}
function referPatient(pid){
  const doctorId = document.getElementById('referDoctor').value;
  const reason = document.getElementById('referReason').value.trim() || 'Specialist review recommended';
  const target = doctorById(doctorId);
  const targetHospital = hospitalById(target.hospital);
  const p = samplePatients.find(x=>x.id===pid);
  state.referrals.unshift({patientId:pid, patientName:p.name, doctorId, fromDoctor: state.currentDoctor.name, reason, date:'23 Aug 2026'});
  if(pid==='p0'){
    state.myReferrals.unshift({doctorId, doctorName: target.name, spec: target.spec, hospitalName: targetHospital.name, fromDoctor: state.currentDoctor.name, reason});
  }
  toast('Referral sent to ' + target.name + ' for ' + p.name);
  render();
}

function patientDoubtsScreen(){
  const unanswered = state.doubts.filter(d=>!d.answer);
  const answered = state.doubts.filter(d=>d.answer);
  return `
  ${topbar('Patient Doubts','General health questions — asked anonymously, any doctor can answer', true)}
  <span class="eyebrow">🕓 Waiting for answer (${unanswered.length})</span>
  ${unanswered.length ? unanswered.map(d=>`
    <div class="card">
      <div class="row"><span class="tag">${d.id}</span><span class="tag tag-marigold">New</span></div>
      <div style="font-weight:600; font-size:13.5px; margin-top:8px;">${d.question}</div>
      <div class="divider"></div>
      <textarea id="ans_${d.id}" rows="2" placeholder="Type your answer..."></textarea>
      <button class="btn btn-marigold btn-sm" style="margin-top:8px;" onclick="answerDoubt('${d.id}')">Post Answer</button>
    </div>`).join('') : `<div class="fine" style="margin-bottom:12px;">No pending doubts right now.</div>`}

  ${answered.length ? `
  <span class="eyebrow" style="margin-top:10px; display:block;">✅ Answered</span>
  ${answered.map(d=>`
    <div class="card">
      <div class="row"><span class="tag">${d.id}</span><span class="tag">${d.answeredBy}</span></div>
      <div style="font-weight:600; font-size:13.5px; margin-top:8px;">${d.question}</div>
      <div class="divider"></div>
      <div class="fine">${d.answer}</div>
    </div>`).join('')}` : ''}
  `;
}
function answerDoubt(id){
  const box = document.getElementById('ans_'+id);
  const ans = box.value.trim();
  if(!ans){ toast('Type an answer first'); return; }
  const d = state.doubts.find(x=>x.id===id);
  d.answer = ans;
  d.answeredBy = state.currentDoctor ? state.currentDoctor.name : 'Doctor';
  toast('Answer posted');
  render();
}

function doctorNav(){
  const items = state.doctorHospital ? [
    {id:'doctorDashboard', icon:'📋', label:t('navToday')},
    {id:'myPatients', icon:'🗂️', label:t('navPatients')},
    {id:'patientDoubts', icon:'❓', label:'Doubts'},
  ] : [];
  const logoutBtn = state.doctorHospital ? `
    <button class="nav-item" onclick="doctorLogout()"><span class="nav-dot">↩️</span>${t('navLogout')}</button>` : '';
  return items.map(i=>`
    <button class="nav-item ${state.screen===i.id?'active':''}" onclick="state.history=[]; go('${i.id}')">
      <span class="nav-dot">${i.icon}</span>${i.label}
    </button>`).join('') + logoutBtn;
}
function doctorLogout(){
  state.doctorHospital = null;
  goLanding();
}

/* ===== LAB SCREENS ===== */
function renderLab(){
  switch(state.screen){
    case 'labLogin': return labLoginScreen();
    case 'labPassword': return labPasswordScreen();
    case 'labDashboard': return labDashboardScreen();
    case 'labPatientRecord': return labPatientRecordScreen();
    default: return state.labId ? labDashboardScreen() : labLoginScreen();
  }
}

function labLoginScreen(){
  return `
  ${topbar('Lab Login','Search your lab to sign in', true)}
  <input class="search-input" placeholder="Search lab name..." oninput="filterLabLogin(this.value)">
  <div id="labLoginResults">${labLoginCards(labs)}</div>
  `;
}
function labLoginCards(list){
  return list.map(l=>`
    <div class="card" onclick="go('labPassword', {pendingLab:'${l.id}'})">
      <div style="font-weight:600; font-size:14px; color:var(--teal-deep);">${l.name}</div>
      <div class="fine">${l.area}</div>
    </div>`).join('');
}
function filterLabLogin(q){
  q=q.toLowerCase();
  const list = labs.filter(l=>l.name.toLowerCase().includes(q));
  document.getElementById('labLoginResults').innerHTML = list.length ? labLoginCards(list) :
    `<div class="empty-state"><h3>No lab found</h3></div>`;
}
function labPasswordScreen(){
  const l = labs.find(x=>x.id===state.pendingLab);
  return `
  ${topbar('Lab Login', l.name, true)}
  <div class="card">
    <span class="eyebrow">Enter your password</span>
    <input class="search-input" type="password" id="labPwd" placeholder="Password" onkeydown="if(event.key==='Enter') submitLabLogin()">
    <button class="btn btn-primary" onclick="submitLabLogin()">Login</button>
  </div>
  <div class="fine">Demo prototype — any password works.</div>
  `;
}
function submitLabLogin(){
  const pwd = document.getElementById('labPwd').value;
  if(!pwd){ toast('Enter your password'); return; }
  loginAsLab(state.pendingLab);
}
function loginAsLab(lid){
  state.labId = lid;
  const l = labs.find(x=>x.id===lid);
  toast('Logged in as ' + l.name);
  state.history=[];
  go('labDashboard');
}
function labDashboardScreen(){
  const l = labs.find(x=>x.id===state.labId);
  const myRequests = state.homeCollectionRequests.filter(r=>r.lab===l.name);
  return `
  <div class="hero-card">
    <span class="tag tag-marigold" style="margin-bottom:8px; display:inline-block;">${state.labLocation}</span>
    <h3>${l.name}</h3>
    <p>${l.area} · ${l.timing}</p>
  </div>

  ${myRequests.length ? `
  <span class="eyebrow">🏠 Home collection requests</span>
  ${myRequests.map((r,idx)=>`
    <div class="card">
      <div class="row">
        <div>
          <div style="font-weight:600; font-size:13.5px;">${r.patientName}</div>
          <div class="fine">Requested ${r.date}</div>
        </div>
        <span class="tag ${r.status==='Collected'?'':'tag-marigold'}">${r.status}</span>
      </div>
      ${r.status==='Pending' ? `<div class="divider"></div><button class="btn btn-ghost btn-sm" onclick="markCollected('${l.name.replace(/'/g,"\\'")}', ${idx})">Mark Sample Collected</button>` : ''}
    </div>`).join('')}
  ` : ''}

  <span class="eyebrow">Upload a report</span>
  <input class="search-input" placeholder="Search patient name..." oninput="filterLabPatients(this.value)">
  <div id="labPatientResults">${labPatientCards(samplePatients)}</div>
  `;
}
function markCollected(labName, idxWithinLab){
  const list = state.homeCollectionRequests.filter(r=>r.lab===labName);
  const target = list[idxWithinLab];
  target.status = 'Collected';
  toast('Marked collected for ' + target.patientName);
  render();
}
function labPatientCards(list){
  return list.map(p=>`
    <div class="card" onclick="go('labPatientRecord', {labSelPatient:'${p.id}'})">
      <div class="row">
        <div class="row" style="gap:12px;">
          <div class="avatar">${p.name[0]}</div>
          <div>
            <div style="font-weight:600; font-size:14px;">${p.name}</div>
            <div class="fine">${p.phone}</div>
          </div>
        </div>
        <span class="tag">${p.reports.length} reports</span>
      </div>
    </div>`).join('');
}
function filterLabPatients(q){
  q=q.toLowerCase();
  const list = samplePatients.filter(p=>p.name.toLowerCase().includes(q));
  document.getElementById('labPatientResults').innerHTML = list.length ? labPatientCards(list) :
    `<div class="empty-state"><h3>No patient found</h3></div>`;
}
function labPatientRecordScreen(){
  const p = samplePatients.find(x=>x.id===state.labSelPatient);
  return `
  ${topbar(p.name, p.phone, true)}
  <span class="eyebrow">Existing reports</span>
  ${p.reports.length ? p.reports.map(r=>`
    <div class="card">
      <div style="font-weight:600; font-size:13.5px;">${r.name}</div>
      <div class="fine">${r.lab} · ${r.date}</div>
    </div>`).join('') : `<div class="fine">No reports yet.</div>`}

  <span class="eyebrow" style="margin-top:6px; display:block;">Upload new report</span>
  <div class="card">
    <input class="med-input" id="reportName" placeholder="Test name, e.g. Blood Test – CBC">
    <input class="med-input" id="reportDate" placeholder="Date, e.g. 23 Aug 2026" value="23 Aug 2026">
    <button class="btn btn-marigold" onclick="uploadReport('${p.id}')">Upload &amp; Send to Patient</button>
  </div>
  <div class="fine">Once uploaded, the report appears instantly in the patient's login and can be shared with their doctor from there.</div>
  `;
}
function uploadReport(pid){
  const name = document.getElementById('reportName').value.trim();
  const date = document.getElementById('reportDate').value.trim() || '23 Aug 2026';
  if(!name){ toast('Enter a test name first'); return; }
  const p = samplePatients.find(x=>x.id===pid);
  const l = labs.find(x=>x.id===state.labId);
  p.reports.unshift({name, date, lab:l.name, sharedWithDoctor:false, accessLog:[]});
  toast('Report uploaded to ' + p.name + '\u2019s app');
  render();
}
function labNav(){
  if(!state.labId) return '';
  return `
    <button class="nav-item ${state.screen==='labDashboard'?'active':''}" onclick="state.history=[]; go('labDashboard')">
      <span class="nav-dot">🧪</span>${t('navUpload')}
    </button>
    <button class="nav-item" onclick="labLogout()"><span class="nav-dot">↩️</span>${t('navLogout')}</button>
  `;
}
function labLogout(){
  state.labId = null;
  goLanding();
}

/* ---------------- CLOCK ---------------- */
function tickClock(){
  const el = document.getElementById('clock');
  const d = new Date();
  let h = d.getHours()%12 || 12;
  const m = d.getMinutes().toString().padStart(2,'0');
  el.textContent = `${h}:${m}`;
}
tickClock(); setInterval(tickClock, 15000);

render();
</script>
</body>
</html>
